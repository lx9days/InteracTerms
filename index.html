<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Evidence Reader · Vocabulary Evidence</title><link rel="stylesheet" href="style.css"></head><body>
<header><div><span class="logo">E</span><strong>Evidence Reader</strong><span class="muted">Interaction Vocabulary Evidence</span></div><button id="export">Export notes</button></header>
<main id="home"><nav class="catalog-tabs" aria-label="Evidence tables"><button data-tab="terms" aria-pressed="true">Terms</button><button data-tab="ambiguities" aria-pressed="false">Ambiguities</button><button data-tab="underspecified" aria-pressed="false">Underspecified expressions</button></nav><section id="termPanel"><div class="heading"><h1>Term Usage Catalog</h1><p id="counts"></p><p id="sync"></p></div>
<div class="filters"><input id="search" type="search" placeholder="Search term names or phrase components" aria-label="Search"><select id="paperFilter" aria-label="Filter papers"><option value="">All papers</option></select><select id="categoryFilter" aria-label="Filter categories"><option value="">All categories</option></select><select id="scopeFilter" aria-label="Filter instance scope"><option value="">All instance scopes</option><option>Eligible instance</option><option>Context / not currently eligible</option></select><select id="statusFilter" aria-label="Filter review status"><option value="">All review statuses</option><option value="待复核">Pending review</option><option value="已核对">Verified</option><option value="存在歧义">Ambiguous</option><option value="信息缺失">Missing information</option></select><button id="browse" hidden>Read paper</button></div>
<div class="table-wrap"><table><thead><tr><th>Term</th><th>Paper</th><th>Framework classification</th><th>Meaning in context</th><th>Source location</th><th>Review status</th></tr></thead><tbody id="list"></tbody></table></div></section><section id="casePanel" hidden><h1 id="caseHeading"></h1><p id="caseIntro"></p><div class="table-wrap"><table><thead id="caseHead"></thead><tbody id="caseList"></tbody></table></div></section></main>
<main id="workspace" hidden><section class="reader"><div class="toolbar"><button id="back">← Catalog</button><button id="prev" aria-label="Previous page">←</button><input id="page" type="number" min="1" aria-label="PDF page"><span id="pages"></span><button id="next" aria-label="Next page">→</button><select id="zoom" aria-label="Zoom"><option value="fit">Fit width</option><option value="1">100%</option><option value="1.5">150%</option><option value="2">200%</option><option value="3">300%</option></select><label>Select matching PDF <input id="file" type="file" accept="application/pdf"></label><a id="original" target="_blank" rel="noopener">Open PDF ↗</a></div>
<h2 id="paperTitle"></h2><div class="legend" id="legend"></div><div id="message" role="status"></div><details id="occurrences" hidden><summary id="occurrenceSummary"></summary><div id="occurrencePages"></div></details><div id="scroll"><div id="sheet"><canvas id="canvas"></canvas><div id="overlay"></div></div></div></section>
<aside class="details"><small>Usage in this paper</small><h2 id="term"></h2><button id="compare">Compare across papers</button><div id="detailBody"></div><section id="editor"><h3>Review and notes</h3><select id="review" aria-label="Review status"><option value="待复核">Pending review</option><option value="已核对">Verified</option><option value="存在歧义">Ambiguous</option><option value="信息缺失">Missing information</option></select><textarea id="note" aria-label="Research notes" placeholder="Record ambiguities or location corrections"></textarea><button id="save">Save notes</button><span id="saved" role="status"></span></section></aside></main>
<dialog id="comparison"><div class="dialog-head"><h2 id="compareTitle"></h2><button id="close">Close</button></div><div id="caseSummary" hidden></div><div id="cards"></div></dialog><script type="module" src="app.mjs"></script></body></html>
